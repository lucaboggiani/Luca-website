about:
  paragraphs:
  - I'm an Italian engineer finishing a double master's degree between the Technical University of Denmark, where
    I study Robotics and Autonomous Systems, and the University of Padova, where I study Neuroscience and Rehabilitation.
    My bachelor's is in Biomedical Engineering.
  - 'What I enjoy most is integration: getting a robot arm, cameras, lasers and sensors to work together as one
    dependable system. At NIL Technology I program Universal Robots arms for high-precision tasks, and at DTU and
    in Padova I''ve built vision pipelines, embedded control systems and real-time sensor-to-actuator loops.'
  - I'm most interested in automation for production and lab environments, such as material handling, inspection
    and quality control, where a system has to be precise, repeatable and safe. My biomedical background also makes
    me comfortable in regulated settings like medtech and life sciences.
  - Outside work I play semi-professional rugby and captain my team. I've been playing since 2011, and I hike whenever
    I can.
  contact_text: Looking for an MSc thesis collaboration from January 2027 and graduate roles in robotics, automation
    and machine vision from summer 2027.

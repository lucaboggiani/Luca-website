projects:
- slug: ur-precision-optics
  title: High-precision UR automation for optical experiments
  kind: Industry
  icon: ur
  featured: true
  summary: Programming a Universal Robots arm to carry out precise tasks in sync with laser systems, cameras and
    power meters at NIL Technology.
  abstract: NIL Technology designs and manufactures optical components. On the optical team I control and program
    a Universal Robots arm that carries out high-precision tasks during advanced optical experiments, coordinated
    with the lab's lasers, cameras and power meters.
  tags:
  - Universal Robots
  - Motion planning
  - Instrument integration
  - Accuracy tuning
  facts:
    Where: NIL Technology, Copenhagen
    When: Aug 2025 – present
    Role: Student assistant, robotics and automation
    Team: Optical team
  sections:
  - title: The setup
    paragraphs:
    - The robot doesn't work alone. Each task involves the arm, a laser system, cameras and power meters, and all
      of them have to act in the right order and at the right position for a measurement to be valid.
  - title: What I do
    bullets:
    - Program and control the UR arm for the experiment workflows.
    - Plan the robot's motions for each task.
    - Tune positioning accuracy so the optical measurements are repeatable.
    - Coordinate the arm with the other instruments in the setup.
  - title: What I've learned
    paragraphs:
    - Working next to optics engineers taught me how much a small positioning error costs downstream, and how to
      design robot routines around the tolerance of the measurement rather than the other way round.
  note: The code is proprietary, so there's no repository for this one.
- slug: fes-exoskeleton
  title: Gait-triggered FES and exoskeleton integration in ROS 2
  kind: Research
  icon: gait
  featured: true
  summary: Porting a real-time functional electrical stimulation system to ROS 2 and coupling it with a lower-limb
    exoskeleton, with latency and safety validated on the bench.
  abstract: A bilateral stimulation system detects the phase of each step from IMU data and fires an 8-channel stimulator
    at the right moment in the gait cycle. My job is to move it from a standalone PyQt6 application into ROS 2 and
    connect it to a lower-limb exoskeleton, so both devices can work from the same picture of where the user is
    in their stride.
  tags:
  - ROS 2
  - Python
  - IMU
  - Real-time systems
  - Safety
  facts:
    Where: BioRobotics Group, CAR-CSIC, Madrid
    When: Oct – Dec 2026
    Role: Visiting research intern
    Status: In progress
  sections:
  - title: The system
    paragraphs:
    - The existing setup uses IMUs to detect gait phases on both legs and triggers a Hasomed P24 8-channel stimulator
      in sync with them. It runs as a PyQt6 desktop app, which works on its own but can't easily share state with
      other devices.
  - title: What I'm building
    bullets:
    - Rewriting the gait detection and stimulation control as ROS 2 nodes.
    - Publishing a shared gait-state topic that both the stimulator and the exoskeleton subscribe to, so they can
      adapt to each other.
    - Keeping the stimulation timing and safety logic intact through the port.
  - title: Validation
    paragraphs:
    - 'The integrated system has a target of under 15 ms end to end, from sensor reading to stimulation. I''ll measure
      that on the bench along with the safety mechanisms, before pilot gait trials compare three conditions: exoskeleton
      only, stimulation only, and both together.'
  - title: Why it matters for automation
    paragraphs:
    - 'This is a sensor-integration problem at heart: several devices, one shared state, hard timing limits and
      safety interlocks that can''t fail. It''s the same discipline as integrating a robot cell, applied to a person.'
- slug: object-tracking
  title: Object recognition and occlusion-aware tracking
  kind: Course project
  icon: vision
  featured: true
  summary: A perception system for an autonomous vehicle that detects, classifies and keeps tracking several objects
    even while they're hidden from view.
  abstract: 'Autonomous systems need to know what''s around them and where it''s going, even when something briefly
    blocks the view. This project builds that pipeline: detecting and classifying objects in camera images, then
    tracking many of them at once with Kalman filters that predict each trajectory through occlusions.'
  tags:
  - Python
  - OpenCV
  - Kalman filter
  - Multi-object tracking
  facts:
    Course: Perception for Autonomous Systems, DTU
    Language: Python
    Libraries: OpenCV
  code: https://github.com/243135-tech/Perception_project
  sections:
  - title: Problem
    paragraphs:
    - Detection alone is not enough for navigation in a dynamic scene. Objects pass behind each other, and a detector
      that only reports what it can see right now loses track of them, then treats them as new objects when they
      reappear.
  - title: Pipeline
    bullets:
    - Image processing and feature extraction on the camera stream.
    - Object detection and classification.
    - Data association to match each detection to an existing track.
    - A Kalman filter per track to estimate position and velocity.
  - title: Handling occlusion
    paragraphs:
    - When an object disappears, its filter keeps predicting where it should be. When a detection shows up near
      that prediction, the track resumes instead of starting over, so the system keeps a continuous identity for
      each object.
  - title: Relevance
    paragraphs:
    - The same pieces, detection, classification and state estimation, sit behind vision-guided picking and inline
      inspection, where parts move on conveyors and are often partly hidden.
- slug: bci-exoskeleton
  title: Motor imagery BCI for exoskeleton control
  kind: Research
  icon: bci
  featured: false
  summary: Real-time EEG decoding that drives a 2-DoF robotic arm and an upper-limb exoskeleton, with a neurofeedback
    game for training.
  abstract: 'A two-class motor imagery brain-computer interface: the user imagines moving a limb, the system decodes
    that intention from EEG in real time and turns it into motion. I built the signal pipeline and classifier, a
    Unity neurofeedback game for training, and integrated both with an upper-limb exoskeleton for active rehabilitation.'
  tags:
  - Python
  - MATLAB
  - EEG
  - Machine learning
  - Unity
  facts:
    Where: NRT-Lab, DTU Electro
    Type: Special course
    Recognition: Invited to Brain & Technology Symposium 2025, Hellerup Hospital
  code: https://github.com/243135-tech/BCI_development
  sections:
  - title: Signal pipeline
    bullets:
    - EEG acquisition and preprocessing.
    - Feature extraction and classification with machine learning, in Python and MATLAB.
    - Real-time decoding of imagined limb movements.
  - title: From signal to motion
    paragraphs:
    - The decoded class drives a 2-DoF robotic arm and, in the full setup, an upper-limb exoskeleton. That closes
      the loop from a noisy biological sensor to a physical actuator, with the latency and reliability constraints
      that come with it.
  - title: Training the user
    paragraphs:
    - BCIs work better when users get immediate feedback. I designed a Unity game that reacts to the decoded signal,
      helping users focus and improve their control over sessions.
  - title: Outcome
    paragraphs:
    - The project earned an invitation to present at the Brain & Technology Symposium 2025 at Hellerup Hospital.
